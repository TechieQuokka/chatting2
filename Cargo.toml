[package]
name = "file-talk"
version = "0.2.6"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
argon2 = { version = "0.5.3", features = ["zeroize"] }
async-trait = "0.1.89"
bincode = "1.3"
futures = "0.3.31"
getrandom = "0.4.1"
sha2 = "0.10"
libp2p = { version = "0.56.0", features = ["gossipsub", "kad", "mdns", "relay", "dcutr", "identify", "request-response", "noise", "yamux", "tcp", "ping", "tokio", "macros", "memory-connection-limits"] }
rand = "0.10.0"
ratatui = "0.29"
crossterm = "0.28"
chrono = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
tempfile = "3.25.0"
